name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libbz2-dev libreadline-dev libffi-dev wget curl lzma liblzma-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 kivy==2.3.0 requests

      - name: Auto-generate Settings and Build APK
        run: |
          # Автоматически создаем чистый конфигурационный файл
          buildozer init
          # Принудительно прописываем требования прямо в файл через замену текста
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,requests,certifi,urllib3,idna,charset-normalizer/g' buildozer.spec
          # Добавляем флаг сборки из исходников
          echo "pip_args = --no-binary=:all:" >> buildozer.spec
          # Запускаем сборку с автоматическим приемом всех лицензий Google
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
